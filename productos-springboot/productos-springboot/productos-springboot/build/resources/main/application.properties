# --- Conexion a la base de datos ---
# La base "tienda_sahumerios" se crea sola la primera vez que se conecta.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_sahumerios?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# --- Configuracion de JPA / Hibernate ---
# update: crea o ajusta las tablas solas a partir de las clases @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Para ver el SQL que genera Hibernate por consola ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Puerto del servidor embebido ---
server.port=8080
